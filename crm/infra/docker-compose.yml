services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lctcrm
      POSTGRES_USER: lctcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./run-local.sh to create local credentials}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lct-crm-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lctcrm -d lctcrm"]
      interval: 3s
      timeout: 3s
      retries: 25

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?missing local admin user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?missing local admin password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: lctcrm
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:18080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./keycloak/lct-realm.json:/opt/keycloak/data/import/lct-realm.json:ro
      - ./keycloak/themes/rtk-crm:/opt/keycloak/themes/rtk-crm:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lct-crm-postgres:
    name: lct-crm-postgres
